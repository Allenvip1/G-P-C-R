name: update-pcr

on:
  schedule:
    # 分钟故意选冷门值（:23/:53），避开 GitHub 整刻钟的排队高峰，减少延迟和被跳过的概率
    - cron: "23 6 * * 1-5"    # 北京时间 14:23，抓初步版
    - cron: "53 6 * * 1-5"    # 北京时间 14:53，兜底再抓一次
    - cron: "23 16 * * 1-5"   # 北京时间次日 00:23，抓最终版并覆盖
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 抓取 CME 日报（PCR 与按到期月拆分）
        id: pcr
        continue-on-error: true      # 失败也继续去抓金价/提交，最后再把任务标红
        run: python scripts/update.py
      - name: 抓取金价、银价日线（Yahoo，失败只告警）
        continue-on-error: true
        run: python scripts/fetch_price.py
      - name: Commit
        run: |
          git config user.name "pcr-bot"
          git config user.email "pcr-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update PCR $(date -u +%F)"
            git push
          fi
      - name: CME 抓取失败时把任务标红
        if: steps.pcr.outcome == 'failure'
        run: exit 1
