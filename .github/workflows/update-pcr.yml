name: update-pcr

on:
  schedule:
    # CME 日报在美国中部时间午夜后发布（约 UTC 06:00），这里取 UTC 07:30，周二至周六
    - cron: "30 7 * * 2-6"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "pcr-bot"
          git config user.email "pcr-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update PCR $(date -u +%F)"
            git push
          fi
