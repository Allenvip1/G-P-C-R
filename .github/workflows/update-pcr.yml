name: update-pcr

on:
  schedule:
    - cron: "15 6 * * 1-5"    # 北京时间 14:15，抓初步版
    - cron: "15 16 * * 1-5"   # 北京时间次日 00:15，抓最终版并覆盖
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update.py
      - name: Commit
        run: |
          git config user.name "pcr-bot"
          git config user.email "pcr-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update PCR $(date -u +%F)"
            git push
          fi
