<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMEX 黄金期权 PCR</title>
<style>
  :root { --bg:#131722; --panel:#1e222d; --line:#2a2e39; --text:#d1d4dc; --dim:#868993; --oi:#ff9800; --vol:#26c6da; --bb:#2962ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  #meta { color:var(--dim); margin-bottom:12px; }
  #meta b { color:var(--text); }
  .controls { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:10px; }
  .controls label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .controls input[type=number], .controls select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 6px; width:64px; }
  .controls select { width:auto; }
  #chart { width:100%; height:460px; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:500; }
  .note { color:var(--dim); font-size:12px; margin-top:16px; }
  .err { color:#ef5350; padding:20px 0; }
  a { color:#6ea8fe; }
</style>
</head>
<body>
<div class="wrap">
  <h1>COMEX 黄金期权 PCR（日线）</h1>
  <div id="meta">加载中…</div>

  <div class="controls">
    <label><input type="checkbox" id="showOI" checked> <span style="color:var(--oi)">持仓量 PCR</span></label>
    <label><input type="checkbox" id="showVol" checked> <span style="color:var(--vol)">成交量 PCR（日）</span></label>
    <label><input type="checkbox" id="bbOn" checked> 布林带</label>
    <label>基于 <select id="bbSrc"><option value="oi">持仓量 PCR</option><option value="vol">成交量 PCR</option></select></label>
    <label>周期 <input type="number" id="bbLen" value="20" min="2" max="200"></label>
    <label>倍数 <input type="number" id="bbMult" value="2" min="0.1" max="5" step="0.1"></label>
  </div>

  <div id="chart"></div>
  <div id="err" class="err" style="display:none"></div>

  <h2>最近数据（最新在前）</h2>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr><th>日期</th><th>看涨成交量</th><th>看跌成交量</th><th>成交量 PCR</th><th>看涨持仓量</th><th>看跌持仓量</th><th>持仓量 PCR</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <p class="note">
    数据来源：CME Group Daily Bulletin（PG02B），COMEX 黄金期权（OG）全部到期月合计，不含周度期权。
    成交量 PCR = 看跌成交量 ÷ 看涨成交量；持仓量 PCR = 看跌持仓量 ÷ 看涨持仓量。
    每个交易日自动更新一次，仅供参考，不构成投资建议。
    布林带需要至少「周期」个交易日的数据才会显示。
    图表由 <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> Lightweight Charts™ 提供。
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
// <pure>
function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/).slice(1).filter(Boolean);
  return lines.map(l => {
    const [date, cv, pv, co, po] = l.split(",");
    return { date, cv: +cv, pv: +pv, co: +co, po: +po, vol: +pv / +cv, oi: +po / +co };
  }).filter(r => r.date && isFinite(r.vol) && isFinite(r.oi))
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}
function bollinger(points, len, mult) {
  const up = [], lo = [], mid = [];
  for (let i = len - 1; i < points.length; i++) {
    const w = points.slice(i - len + 1, i + 1).map(p => p.value);
    const m = w.reduce((a, b) => a + b, 0) / len;
    const sd = Math.sqrt(w.reduce((a, b) => a + (b - m) * (b - m), 0) / len);   // 总体标准差，与 TradingView 一致
    const t = points[i].time;
    mid.push({ time: t, value: m });
    up.push({ time: t, value: m + mult * sd });
    lo.push({ time: t, value: m - mult * sd });
  }
  return { up, lo, mid };
}
// </pure>

const $ = id => document.getElementById(id);

function rawUrl() {
  const host = location.hostname;
  if (host.endsWith(".github.io")) {
    const user = host.split(".")[0];
    const repo = location.pathname.split("/")[1];
    if (repo) return `https://raw.githubusercontent.com/${user}/${repo}/main/data/gold_pcr.csv`;
  }
  return null;
}

async function loadCsv() {
  // 先读仓库里的最新文件（不依赖 Pages 重新构建），失败再读页面自带的副本
  const urls = [rawUrl(), "data/gold_pcr.csv"].filter(Boolean);
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: "no-cache" });
      if (r.ok) return await r.text();
    } catch (e) { /* 试下一个 */ }
  }
  throw new Error("无法加载 data/gold_pcr.csv");
}

function fmt(n) { return n.toLocaleString("en-US"); }

async function main() {
  let rows;
  try {
    rows = parseCsv(await loadCsv());
    if (!rows.length) throw new Error("数据文件是空的");
  } catch (e) {
    $("meta").textContent = "";
    $("err").style.display = "block";
    $("err").textContent = "加载失败：" + e.message;
    return;
  }

  const last = rows[rows.length - 1];
  $("meta").innerHTML = `数据截至 <b>${last.date}</b> ｜ 持仓量 PCR <b>${last.oi.toFixed(4)}</b> ｜ 成交量 PCR <b>${last.vol.toFixed(4)}</b> ｜ 共 ${rows.length} 个交易日`;

  const tbody = $("tbl").querySelector("tbody");
  rows.slice(-30).reverse().forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.date}</td><td>${fmt(r.cv)}</td><td>${fmt(r.pv)}</td><td>${r.vol.toFixed(4)}</td><td>${fmt(r.co)}</td><td>${fmt(r.po)}</td><td>${r.oi.toFixed(4)}</td>`;
    tbody.appendChild(tr);
  });

  const el = $("chart");
  const chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: 460,
    layout: { background: { color: "#131722" }, textColor: "#d1d4dc" },
    grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
    rightPriceScale: { borderColor: "#2a2e39" },
    timeScale: { borderColor: "#2a2e39" },
  });
  window.addEventListener("resize", () => chart.applyOptions({ width: el.clientWidth }));

  const pf = { type: "price", precision: 4, minMove: 0.0001 };
  const sOI  = chart.addLineSeries({ color: "#ff9800", lineWidth: 2, title: "持仓量 PCR", priceFormat: pf });
  const sVol = chart.addLineSeries({ color: "#26c6da", lineWidth: 1, title: "成交量 PCR", priceFormat: pf });
  const bbOpt = { color: "#2962ff", lineWidth: 1, priceFormat: pf, lastValueVisible: false, priceLineVisible: false };
  const sUp  = chart.addLineSeries({ ...bbOpt });
  const sLo  = chart.addLineSeries({ ...bbOpt });
  const sMid = chart.addLineSeries({ ...bbOpt, color: "#868993", lineStyle: 2 });

  const ptsOI  = rows.map(r => ({ time: r.date, value: r.oi }));
  const ptsVol = rows.map(r => ({ time: r.date, value: r.vol }));
  sOI.setData(ptsOI);
  sVol.setData(ptsVol);
  // 数据很少时线画不出来，用标记点显示最新一天
  sOI.setMarkers([{ time: last.date, position: "aboveBar", color: "#ff9800", shape: "circle", text: last.oi.toFixed(4) }]);
  sVol.setMarkers([{ time: last.date, position: "belowBar", color: "#26c6da", shape: "circle", text: last.vol.toFixed(4) }]);

  function render() {
    sOI.applyOptions({ visible: $("showOI").checked });
    sVol.applyOptions({ visible: $("showVol").checked });
    const len = Math.max(2, parseInt($("bbLen").value) || 20);
    const mult = parseFloat($("bbMult").value) || 2;
    const src = $("bbSrc").value === "oi" ? ptsOI : ptsVol;
    const b = bollinger(src, len, mult);
    sUp.setData(b.up); sLo.setData(b.lo); sMid.setData(b.mid);
    const on = $("bbOn").checked;
    [sUp, sLo, sMid].forEach(s => s.applyOptions({ visible: on }));
  }
  ["showOI", "showVol", "bbOn", "bbSrc", "bbLen", "bbMult"].forEach(id => $(id).addEventListener("input", render));
  render();
  chart.timeScale().fitContent();
}
main();
</script>
</body>
</html>
